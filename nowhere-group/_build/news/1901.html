<p>Nowhere Group株式会社（本社：東京都、代表取締役：竹内剛）は、民泊・宿泊施設の価値向上を目的としたコンテスト「BEST OF MINPAKU 2026」において、「OMATSURI BASE Nakanoshimbashi」がグランプリを受賞いたしました。</p>
<p>本受賞は、単なる稼働率や売上といった運営指標だけでなく、コンセプト設計・空間デザイン・顧客体験・収益設計までを含めた総合的なプロデュース力が評価されました。</p>
