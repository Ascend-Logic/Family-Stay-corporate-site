<!--meta {"redirect":"https://nowhere.group/contact/","title":"お問い合わせ","description":"Nowhere Groupへのお問い合わせ。宿泊施設のプロデュース・運営、不動産・工事・建物管理、清掃、ホテルSUPPLY、事業提携までグループ共通窓口で承ります。","nav":"contact","accent":"c-orange","cta":false,"hero":{"type":"illust","en":"Contact","ja":"お問い合わせ","color":"orange","img":"bg-footer.jpg"},"crumbs":[["Contact",""]]} -->
<section class="sec">
<div class="wrap">
<div style="margin-bottom:clamp(32px,4vw,56px)">
<p class="lead" style="font-size:clamp(18px,2.2vw,24px);text-align:center">宿泊施設のプロデュース・運営、不動産・工事・建物管理、清掃、<br class="pc-br">ホテルSUPPLY、事業提携まで。Nowhere Groupへのお問い合わせは、<br class="pc-br">グループ共通窓口で承ります。内容に応じて、各社・担当部署よりご案内します。</p>
</div>
<!--
  送信先（action）は未設定です。実際に受信できる送信先 URL（Formspree / Google Apps Script / 自社API など）を action に設定してください。
  英語版 _build/pages/en/contact.html の action も同じ URL にすること。action="#" のままでは送信せず「準備中」と表示します（公開不可の状態）。
  送信内容: name / email / tel / company / facility / type（種別の値）/ route（社内受付先）/ message / agree / lang
-->
<form class="form" data-contact action="#" method="post" novalidate>
<p class="note"><span class="req" style="margin:0 6px 0 0">必須</span>が付いている項目は必ずご入力ください。</p>
<div class="field">
<label for="f-name">お名前<span class="req">必須</span></label>
<input id="f-name" type="text" name="name" autocomplete="name" placeholder="例）山田 太郎" required>
</div>
<div class="field">
<label for="f-mail">メールアドレス<span class="req">必須</span></label>
<input id="f-mail" type="email" name="email" autocomplete="email" inputmode="email" placeholder="例）info@example.com" required>
</div>
<div class="field">
<label for="f-tel">電話番号<span class="opt">任意</span></label>
<input id="f-tel" type="tel" name="tel" autocomplete="tel" inputmode="tel" placeholder="例）03-1234-5678">
</div>
<div class="field">
<label for="f-company">企業名<span class="opt">任意</span></label>
<input id="f-company" type="text" name="company" autocomplete="organization" placeholder="例）株式会社〇〇">
</div>
<div class="field">
<label for="f-type">お問い合わせ種別<span class="req">必須</span></label>
<select id="f-type" name="type" required aria-describedby="f-type-hint">
<option value="">選択してください</option>
<option value="produce" data-route="Nowhere Group 宿泊事業部" data-facility data-hint="宿泊施設の開発・プロデュースに関するご相談として、Nowhere Group 宿泊事業部よりご案内します。">宿泊施設プロデュースについて</option>
<option value="operation" data-route="Nowhere Group 宿泊事業部" data-facility data-hint="宿泊施設の運営に関するご相談として、Nowhere Group 宿泊事業部よりご案内します。">宿泊施設運営について</option>
<option value="real-estate" data-route="VESTPORT" data-hint="不動産・工事・建物管理は、VESTPORT株式会社よりご案内します。">不動産・工事・建物管理について</option>
<option value="cleaning" data-route="CLEANX9" data-hint="清掃に関するお問い合わせは、CLEANX9株式会社よりご案内します。">清掃について</option>
<option value="supply" data-route="Nowhere Group SUPPLY事業部" data-hint="ホテルSUPPLYに関するお問い合わせは、Nowhere Group SUPPLY事業部よりご案内します。">ホテルSUPPLYについて</option>
<option value="brand" data-route="グループ事業企画部・営業担当" data-hint="ホテルブランドの共同開発に関するご相談として、グループ事業企画部・営業担当よりご案内します。">ホテルブランド・共同開発について</option>
<option value="family-stay" data-route="Family Stay 事業開発窓口" data-hint="株式会社Family Stayの家族旅行に特化したOTA・リテールメディアは、現在開発準備中です。事業開発窓口よりご案内します。">Family Stay（OTA・リテールメディア）について</option>
<option value="partnership" data-route="グループ営業部／社長室" data-hint="グループ共通窓口で受け付け、内容に応じて担当部署へ社内でおつなぎします。">パートナー・事業提携について</option>
<option value="reservation" data-route="各施設ゲスト専用窓口" data-facility data-hint="ご予約やご滞在中のお問い合わせは、各施設のゲスト専用窓口（予約サイトのメッセージ機能など）が最も早くご案内できます。こちらから送信される場合は、施設名をご入力ください。">宿泊予約・施設利用について</option>
<option value="recruit" data-route="社長室・採用窓口" data-block data-hint="採用・カジュアル面談については、採用情報ページからお申し込みください。このフォームでは受け付けていません。">採用・カジュアル面談について</option>
<option value="media" data-route="PR担当" data-hint="グループ共通窓口で受け付け、PR担当へ社内でおつなぎします。">取材・広報について</option>
<option value="other" data-route="コーポレート本部" data-hint="グループ共通窓口で受け付け、内容に応じて担当部署へ社内でおつなぎします。">その他</option>
</select>
<p class="note type-hint" id="f-type-hint" aria-live="polite" hidden></p>
<p class="type-block" data-block-msg hidden><a class="btn" href="{{root}}recruit/">採用情報を見る <span class="arr">→</span></a></p>
</div>
<div class="field" data-facility-field hidden>
<label for="f-facility">施設名<span class="opt">任意</span></label>
<input id="f-facility" type="text" name="facility" placeholder="例）OMATSURI BASE 中野新橋">
</div>
<div class="field">
<label for="f-msg">お問い合わせ内容<span class="req">必須</span></label>
<textarea id="f-msg" name="message" placeholder="お問い合わせ内容を入力してください" required></textarea>
</div>
<div class="hp" aria-hidden="true"><label for="f-hp">このフィールドは空のままにしてください</label><input id="f-hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off"></div>
<p class="note">内容を確認のうえ、担当の会社・部署よりメールまたはお電話でご連絡します。</p>
<label class="agree"><input type="checkbox" name="agree" required><span><a href="{{root}}privacy/" target="_blank">プライバシーポリシー</a>の内容をご確認の上、同意いただける場合はチェックしてください。</span></label>
<p class="form-msg" role="status" tabindex="-1"></p>
<button class="btn btn-dark submit" type="submit">送信する <span class="arr">→</span></button>
</form>
<p class="note" style="text-align:center;margin-top:28px">お電話でのお問い合わせ：<a href="tel:0364547875">03-6454-7875</a></p>
</div>
</section>
